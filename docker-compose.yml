services:

  employee-backend:
    build: ./employee_app
    ports:
      - "8080:8080"
    volumes:
      - ./expenses_system_db.db:/database/expenses_system_db.db

  manager-backend:
    build: ./manager_app
    ports:
      - "9090:9090"
    volumes:
      - ./expenses_system_db.db:/database/expenses_system_db.db

  frontend:
    build: ./web_app
    ports:
      - "5173:5173"
    depends_on:
      - employee-backend
      - manager-backend

  selenium:
    image: selenium/standalone-chrome
    ports:
      - "4444:4444"
    shm_size: "2gb"